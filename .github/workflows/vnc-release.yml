name: vnc-release

# On a tag vnc-v0.1.0: check the tag against vnc/pyproject.toml and vnc/server.json, build oriel-vnc, publish it to
# PyPI through trusted publishing (no API token), then list it in the MCP Registry as io.github.YordiLorenzo/oriel-vnc.
on:
  push:
    tags: ['vnc-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the tag against vnc/pyproject.toml and vnc/server.json
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#vnc-v}"
          project=$(python3 -c 'import tomllib; print(tomllib.load(open("vnc/pyproject.toml", "rb"))["project"]["version"])')
          if [ "$project" != "$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but vnc/pyproject.toml has version '$project'."
            exit 1
          fi
          listed=$(jq -r '.version + " " + .packages[0].version' vnc/server.json)
          if [ "$listed" != "$version $version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but vnc/server.json has version and package version '$listed'."
            exit 1
          fi

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # The repository's LICENSE sits above vnc/, so it is copied in for the wheel and the sdist to include it.
      - name: Build
        run: |
          cp LICENSE vnc/LICENSE
          uv build vnc --out-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/oriel-vnc/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  # From https://modelcontextprotocol.io/registry/github-actions. The registry checks that the PyPI README holds
  # "mcp-name: io.github.YordiLorenzo/oriel-vnc".
  registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      # The registry reads the release from PyPI's JSON API, where a new release can take a moment to appear.
      - name: Wait for the release on PyPI
        run: |
          version="${GITHUB_REF_NAME#vnc-v}"
          for _ in $(seq 30); do
            if curl --fail --silent --output /dev/null "https://pypi.org/pypi/oriel-vnc/$version/json"; then exit 0; fi
            sleep 10
          done
          echo "::error::oriel-vnc $version was not on https://pypi.org/pypi/oriel-vnc/$version/json after 5 minutes."
          exit 1

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish vnc/server.json
