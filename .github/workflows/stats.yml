name: stats

# Once a day, saves the download count of each release file and this repository's views, clones and referrers as CSV
# files in the private repository YordiLorenzo/oriel-stats. GitHub keeps traffic for 14 days only and shows it only to
# people with push access, so the history goes to a private repository and not to this public one.
#
# It needs two fine-grained personal access tokens, saved as secrets of this repository. One token cannot do both jobs:
# a token has one set of permissions for every repository it can reach, and write access to this repository would let
# it change releases.
#   TRAFFIC_TOKEN  repository YordiLorenzo/oriel only, "Administration: Read-only" (GITHUB_TOKEN cannot read traffic)
#   STATS_TOKEN    repository YordiLorenzo/oriel-stats only, "Contents: Read and write"
# Until both are set, each run prints a notice and saves nothing. The download totals stay public in the releases API.
on:
  schedule:
    - cron: '17 4 * * *'  # 04:17 UTC each day; GitHub delays runs that start on the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stats
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  save:
    name: Save counts to YordiLorenzo/oriel-stats
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Save the counts
        env:
          GH_TOKEN: ${{ github.token }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          STATS_REPO: YordiLorenzo/oriel-stats
        run: |
          if [ -z "$TRAFFIC_TOKEN" ] || [ -z "$STATS_TOKEN" ]; then
            echo "::notice::TRAFFIC_TOKEN and STATS_TOKEN are not both set, so nothing was saved. See the top of stats.yml."
            exit 0
          fi

          git clone --quiet --depth=1 "https://x-access-token:${STATS_TOKEN}@github.com/${STATS_REPO}.git" stats
          cd stats

          TODAY=$(date -u +%F)
          export TODAY

          # upsert FILE HEADER KEYS: merges the CSV rows on stdin into FILE. A new row replaces the old row with the same
          # first KEYS columns, so a second run on one day, or a day that GitHub reports again, adds no duplicate.
          upsert() {
            { cat; if [ -f "$1" ]; then tail -n +2 "$1"; fi; } |
              awk -F, -v keys="$3" '{ key = $1; for (i = 2; i <= keys; i++) key = key FS $i } !seen[key]++' |
              sort > rows.tmp
            { echo "$2"; cat rows.tmp; } > "$1"
            rm rows.tmp
          }

          # Total downloads so far of each file of each published release. Drafts from release.yml are left out.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft | not) | {tag: .tag_name, file: .assets[]} | [env.TODAY, .tag, .file.name, .file.download_count] | @csv' |
            upsert downloads.csv date,release,file,downloads_total 3

          export GH_TOKEN="$TRAFFIC_TOKEN"
          # Views and clones per UTC day for the last 14 days. The newest day can be partial; the next run replaces it.
          gh api "repos/$GITHUB_REPOSITORY/traffic/views" --jq '.views[] | [.timestamp[:10], .count, .uniques] | @csv' |
            upsert views.csv date,views,unique_visitors 1
          gh api "repos/$GITHUB_REPOSITORY/traffic/clones" --jq '.clones[] | [.timestamp[:10], .count, .uniques] | @csv' |
            upsert clones.csv date,clones,unique_cloners 1
          # The top 10 referring sites, each counted over the 14 days up to that date.
          gh api "repos/$GITHUB_REPOSITORY/traffic/popular/referrers" \
            --jq '.[] | [env.TODAY, .referrer, .count, .uniques] | @csv' |
            upsert referrers.csv date,referrer,views_last_14_days,unique_visitors_last_14_days 2

          git add -- *.csv
          if git diff --cached --quiet; then
            echo "Nothing changed since the last run."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --message "Stats for $TODAY"
          git push --quiet origin HEAD
