name: release

# On a version tag (v0.1.0): build oriel.exe with that version, smoke-test it, pack it as an MCP bundle
# (oriel-0.1.0-win-x64.mcpb), attest both files' build provenance and draft a GitHub release with oriel.exe, the bundle
# and SHA256SUMS. Someone publishes the draft by hand; mcp-registry.yml then puts that version into the MCP Registry.
# The exe asset is always named oriel.exe, so releases/latest/download/oriel.exe points at the newest published release.
on:
  push:
    tags: ['v[0-9]*']  # not vnc-v*, which vnc-release.yml handles

permissions:
  contents: write
  id-token: write      # attest-build-provenance signs with a Sigstore certificate
  attestations: write  # and stores the attestation in the repository

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The tag must match the top heading of CHANGELOG.md ("## 0.1.0 - unreleased", "## 0.1.0 - 2026-11-02" or
      # "## [0.1.0]"), and that section becomes the release notes.
      - name: Check the tag against CHANGELOG.md and write the notes
        id: changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          top=$(awk '{ sub(/\r$/, "") } /^## / { v = $2; gsub(/^\[|\]$/, "", v); sub(/^v/, "", v); print v; exit }' CHANGELOG.md)
          if [ "$top" != "$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but the top heading of CHANGELOG.md is version '$top'."
            exit 1
          fi
          notes="$RUNNER_TEMP/notes.md"
          awk '{ sub(/\r$/, "") } /^## / { if (found) exit; found = 1; next } found { print }' CHANGELOG.md > "$notes"
          cat >> "$notes" <<'EOF'

          ## Install

          Download `oriel.exe` below and run `.\oriel.exe install` in a terminal. It installs oriel for your Windows
          account only, without admin rights, and prints the MCP command for your agent. Add `--autostart` to start its
          daemon at every logon. `oriel uninstall` removes it again.

          For Claude Desktop, download the `.mcpb` file below and open it with Claude Desktop, which installs it as an
          extension. This way isn't tested yet.

          To check a download, compare `(Get-FileHash oriel.exe).Hash` with `SHA256SUMS`, or run
          `gh attestation verify oriel.exe -R YordiLorenzo/oriel`, which checks that this repository's release workflow
          built it.

          This build isn't code-signed yet, so Windows may warn about it, and Smart App Control blocks it.

          EOF
          echo "All changes: [CHANGELOG.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)" >> "$notes"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Build with the .NET Framework compiler
        shell: powershell
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
        run: powershell -ExecutionPolicy Bypass -File build\build.ps1 -Version $env:VERSION

      # build.yml's smoke test, after checking that the version reached the exe.
      - name: Smoke test
        shell: powershell
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          $printed = dist\oriel.exe version
          if ($printed -ne "oriel $env:VERSION") { throw "oriel version printed '$printed', not 'oriel $env:VERSION'" }
          $product = (Get-Item dist\oriel.exe).VersionInfo.ProductVersion
          if ($product -ne $env:VERSION) { throw "the exe's product version is '$product', not '$env:VERSION'" }
          dist\oriel.exe call windows

      # The bundle's manifest lists the tools that src/Mcp.cs serves; a tool added there and not in the manifest stops
      # the release here. diff --strip-trailing-cr: the Windows checkout and jq.exe both write CRLF.
      - name: Pack the MCP bundle
        shell: bash
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          if ! diff --strip-trailing-cr <(sed -n 's/^ *T("\([a-z]*\)".*/\1/p' src/Mcp.cs) <(jq -r '.tools[].name' mcpb/manifest.json); then
            echo "::error::The tools in mcpb/manifest.json differ from src/Mcp.cs (< only in Mcp.cs, > only in the manifest)."
            exit 1
          fi
          stage="$RUNNER_TEMP/mcpb"
          mkdir -p "$stage"
          jq --arg v "$VERSION" '.version = $v' mcpb/manifest.json > "$stage/manifest.json"
          cp mcpb/icon.png LICENSE dist/oriel.exe "$stage/"
          npx --yes @anthropic-ai/mcpb@2.1.2 pack "$stage" "dist/oriel-$VERSION-win-x64.mcpb"

      - name: Write SHA256SUMS
        shell: powershell
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          $sums = foreach ($name in "oriel.exe", "oriel-$env:VERSION-win-x64.mcpb") {
            "$((Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower())  $name`n"
          }
          [IO.File]::WriteAllText("$PWD\dist\SHA256SUMS", -join $sums)
          Get-Content dist\SHA256SUMS

      # gh attestation verify <file> -R YordiLorenzo/oriel checks a download against this.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/oriel.exe
            dist/oriel-${{ steps.changelog.outputs.version }}-win-x64.mcpb

      - name: Draft the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.changelog.outputs.version }}
          NOTES: ${{ steps.changelog.outputs.notes }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/oriel.exe "dist/oriel-$VERSION-win-x64.mcpb" dist/SHA256SUMS
          --draft --title "oriel $VERSION" --notes-file "$NOTES"
