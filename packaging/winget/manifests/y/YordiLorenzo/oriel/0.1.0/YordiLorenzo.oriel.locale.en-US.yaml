ShortDescription: MCP server that lets an AI assistant use the apps on your Windows PC by reading each window as text, through the accessibility tree.
Description: |-
  oriel is an MCP server for Windows. It reads each window as text through UI Automation, the accessibility tree that screen readers use, and acts on the controls directly (press, fill, select, scroll) without moving the mouse or taking focus. Every action replies with what changed in the window. Keys, clicks and screenshots are there for apps that have no accessibility tree.
  It is one exe for the .NET Framework 4.8 that Windows includes, and it needs no admin rights. An MCP client starts it with `oriel mcp`; from another computer, `ssh <pc> oriel mcp`.
  Password fields are refused, sign-in screens, UAC prompts and password managers are off limits, and there is no shell by default.
Moniker: oriel
Tags:
