ReleaseNotesUrl: https://github.com/YordiLorenzo/oriel/releases/tag/v0.1.0
InstallationNotes: |-
  Open a new terminal so that `oriel` is on your PATH. To add it to Claude Code: claude mcp add --scope user oriel -- oriel mcp
  Before `winget uninstall YordiLorenzo.oriel`, run `oriel uninstall`: it stops oriel and deletes its settings folder, %LOCALAPPDATA%\oriel.
