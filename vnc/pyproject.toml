[project]
name = "oriel-vnc"
version = "0.1.0"
description = "MCP server that operates any desktop over VNC: screenshots, clicks and keys."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "YordiLorenzo" }]
requires-python = ">=3.11"
dependencies = ["mcp>=2.3", "vncdotool>=1.4.2", "pillow>=10"]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "vnc",
    "computer-use",
    "desktop-automation",
    "remote-desktop",
    "screenshots",
    "ai-agents",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
oriel-vnc = "oriel_vnc:main"

[project.urls]
Homepage = "https://yordilorenzo.github.io/oriel/"
Source = "https://github.com/YordiLorenzo/oriel"
Issues = "https://github.com/YordiLorenzo/oriel/issues"
Changelog = "https://github.com/YordiLorenzo/oriel/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["oriel_vnc.py"]
