[project]
name = "oriel-vnc"
version = "0.1.0"
description = "MCP server that operates any desktop over VNC: screenshots, clicks and keys."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3", "vncdotool>=1.4.2", "pillow>=10"]

[project.scripts]
oriel-vnc = "oriel_vnc:main"

[project.urls]
Homepage = "https://github.com/YordiLorenzo/oriel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["oriel_vnc.py"]
