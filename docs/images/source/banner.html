<!doctype html>
<!--
  oriel's README banner, 1600 x 500. Same look as social-preview.html: colours from site/style.css, the font is
  site/fonts/fraunces.woff2, icon.svg is the brand kit's vector icon. Render from the repo root:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1600,500 --virtual-time-budget=5000 \
      --user-data-dir="$(mktemp -d)" --screenshot="$PWD/docs/images/banner.png" \
      "file://$PWD/docs/images/source/banner.html"
    magick docs/images/banner.png -alpha off -strip docs/images/banner.png
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>oriel banner</title>
<style>
  @font-face {
    font-family: "Fraunces";
    src: url("../../../site/fonts/fraunces.woff2") format("woff2");
    font-weight: 500 600;
    font-style: normal;
  }

  :root {
    --night: #0b0f1e;
    --cream: #f5ecdc;
    --amber: #ffb547;
    --ember: #e07b2c;
  }

  html, body { margin: 0; }

  body {
    width: 1600px;
    height: 500px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Fraunces", serif;
    font-weight: 560;
    -webkit-font-smoothing: antialiased;
    /* The card's two glows at the card's pixel sizes: warm at the icon's right edge, cool top right. */
    background:
      radial-gradient(ellipse 704px 352px at 33% 50%, rgb(255 181 71 / .28), rgb(224 123 44 / .08) 50%, rgb(224 123 44 / 0)),
      radial-gradient(ellipse 896px 448px at 85% 10%, rgb(42 60 120 / .55), rgb(22 32 61 / 0)),
      var(--night);
  }

  .card { display: flex; align-items: center; gap: 53px; }
  .card img { width: 300px; height: 300px; }

  .word {
    margin: 0 0 14px;
    color: #fff;
    font-size: 176px;
    line-height: .8;
    letter-spacing: -.01em;
  }

  .tagline {
    margin: 0 0 0 4px;
    color: rgb(245 236 220 / .82);
    font-size: 40px;
    line-height: 1.7;
  }

  .facts {
    margin: 6px 0 0 4px;
    color: var(--amber);
    font-size: 27px;
    line-height: 1.3;
    letter-spacing: .01em;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="icon.svg" alt="">
    <div>
      <p class="word">oriel</p>
      <p class="tagline">Lets Claude Code use your Windows apps.</p>
      <p class="facts">Free and open source · Windows 11 · MCP server</p>
    </div>
  </div>
</body>
</html>
